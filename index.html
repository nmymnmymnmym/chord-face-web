<title>Chord Face</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;500;600;700&family=Libre+Caslon+Display&family=Noto+Music&display=swap">
<style>

:root {

  --paper: #0a0a0b;
  --ink: #ecebe6;
  --muted: #8b8c90;
  --rule: #ecebe6;
  --accent: #93a6ff;
  --key: #0a0a0b;
  --panel: rgba(10, 10, 11, 0.96);
  --window: #0a0a0b;
  --window-ink: #ecebe6;
  --display: "Libre Caslon Display", "Noto Music", "Times New Roman", serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  color-scheme: dark;
}

html,
body {
  height: 100%;
}
html {
  box-sizing: border-box;
}
body {
  margin: 0;
  display: flex;
  overflow: hidden;
  background: var(--paper);
  color: var(--ink);
  font: 400 12px/1.4 var(--mono);
  -webkit-tap-highlight-color: transparent;
}

.app {
  flex: 1 1 0;
  min-width: 0;
  box-sizing: border-box;
  height: 100%;
  max-width: 1080px;
  margin: 0 auto;
  padding-inline: 16px;
  padding-block: clamp(10px, 2.2vh, 24px);
  display: grid;
  grid-template-rows: auto minmax(0, 1fr) auto auto;
  gap: clamp(8px, 2vh, 20px);
}


.masthead {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 12px;
}
.name {
  margin: 0;
  font: 400 clamp(18px, 2.4vh, 24px) / 1 var(--display);
  letter-spacing: 0.01em;
}
.tools {
  display: flex;
  gap: 6px;
}
.chip {
  font: 500 10px/1 var(--mono);
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--ink);
  background: transparent;
  border: 1px solid var(--rule);
  padding: 6px 8px;
  cursor: pointer;
}
.chip[aria-pressed="true"] {
  background: var(--ink);
  color: var(--paper);
}
.chip:focus-visible,
.res select:focus-visible,
.keys:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}


.stage {
  min-height: 0;
  display: flex;
  align-items: center;
  justify-content: center;
}
.portrait {
  position: relative;
  box-sizing: border-box;
  border: 3px solid var(--rule);
  background: var(--window);
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
}
.face {
  margin: 0;
  font-family: var(--mono);
  white-space: pre;
  letter-spacing: 0;
  color: var(--window-ink);
  user-select: none;
  -webkit-user-select: none;
}

  inherits: true;
  initial-value: 0%;
}
.faces {

  --aura-o: 0;
  --tint-h: 0;
  --tint-a: 0;
  --r1: -50%;
  --a1: 0;
  --s1: 1;
  --r2: -50%;
  --a2: 0;
  --s2: 1;
  animation: aura-flow 2.4s linear infinite;
}
.face {
  font-weight: 300;
}
.face.paint {
  color: transparent;
  background-image: repeating-radial-gradient(
      circle at 50% 42%,
      hsl(350 100% 62% / var(--aura-o)) calc(var(--aura-shift) + 0%),
      hsl(28 100% 58% / var(--aura-o)) calc(var(--aura-shift) + 4%),
      hsl(55 100% 55% / var(--aura-o)) calc(var(--aura-shift) + 8%),
      hsl(130 90% 52% / var(--aura-o)) calc(var(--aura-shift) + 12%),
      hsl(195 100% 55% / var(--aura-o)) calc(var(--aura-shift) + 16%),
      hsl(255 100% 68% / var(--aura-o)) calc(var(--aura-shift) + 20%),
      hsl(310 100% 62% / var(--aura-o)) calc(var(--aura-shift) + 24%),

    linear-gradient(var(--window-ink), var(--window-ink));
  -webkit-background-clip: text;
  background-clip: text;
}
.face.layer {
  position: absolute;
  inset: 0;
  pointer-events: none;
}
@keyframes aura-flow {
  from {
    --aura-shift: 0%;
  }
  to {
    --aura-shift: 28%;
  }
}

.face.wave {
  --hw1: calc(var(--h) * var(--s1));
  --hw2: calc(var(--h) * var(--s2));
  -webkit-mask-image: radial-gradient(
      circle at 50% 42%,
      transparent calc(var(--r1) - var(--hw1) - 1.5%),
      rgb(0 0 0 / var(--a1)) calc(var(--r1) - var(--hw1)),
      rgb(0 0 0 / var(--a1)) calc(var(--r1) + var(--hw1)),
      transparent calc(var(--r1) + var(--hw1) + 1.5%)
    ),
    radial-gradient(
      circle at 50% 42%,
      transparent calc(var(--r2) - var(--hw2) - 1.5%),
      rgb(0 0 0 / var(--a2)) calc(var(--r2) - var(--hw2)),
      rgb(0 0 0 / var(--a2)) calc(var(--r2) + var(--hw2)),
      transparent calc(var(--r2) + var(--hw2) + 1.5%)
    );
  mask-image: radial-gradient(
      circle at 50% 42%,
      transparent calc(var(--r1) - var(--hw1) - 1.5%),
      rgb(0 0 0 / var(--a1)) calc(var(--r1) - var(--hw1)),
      rgb(0 0 0 / var(--a1)) calc(var(--r1) + var(--hw1)),
      transparent calc(var(--r1) + var(--hw1) + 1.5%)
    ),
    radial-gradient(
      circle at 50% 42%,
      transparent calc(var(--r2) - var(--hw2) - 1.5%),
      rgb(0 0 0 / var(--a2)) calc(var(--r2) - var(--hw2)),
      rgb(0 0 0 / var(--a2)) calc(var(--r2) + var(--hw2)),
      transparent calc(var(--r2) + var(--hw2) + 1.5%)

  mask-composite: add;
}
.face.w1 {
  font-weight: 500;
  --h: 7%;
}
.face.w2 {
  font-weight: 600;
  --h: 4.5%;
}
.face.w3 {
  font-weight: 700;
  --h: 2.5%;
}
@media (prefers-reduced-motion: reduce) {
  .faces {
    animation: none;
  }
  .face.wave {
    display: none;
  }
}
.res {
  position: absolute;
  top: 8px;
  right: 8px;
  display: flex;
  gap: 6px;
}
.res select {
  appearance: none;
  -webkit-appearance: none;
  font: 500 11px/1 var(--mono);
  color: var(--window-ink);
  background-color: var(--window);
  border: 1.5px solid var(--window-ink);
  border-radius: 0;
  padding: 5px 20px 5px 7px;
  background-image: linear-gradient(45deg, transparent 50%, var(--window-ink) 50%), linear-gradient(135deg, var(--window-ink) 50%, transparent 50%);
  background-position: calc(100% - 10px) 50%, calc(100% - 6px) 50%;
  background-size: 4px 4px;
  background-repeat: no-repeat;
  cursor: pointer;
}


.placard {
  justify-self: center;
  display: grid;
  justify-items: center;
  gap: 4px;
}
.chord {
  min-width: 7ch;
  box-sizing: border-box;
  border: 1.5px solid var(--rule);
  padding: 0.12em 0.7em 0.02em;
  text-align: center;
  font: 400 clamp(30px, 6.2vh, 64px) / 1.15 var(--display);
  transition: opacity 0.6s ease;
}
.chord.resting {
  opacity: 0.35;
}
.hint {
  color: var(--muted);
  font-size: 11px;
  letter-spacing: 0.04em;
  min-height: 1.4em;
}


.keys {
  position: relative;
  height: clamp(64px, 14vh, 128px);
  border: 1.5px solid var(--rule);
  touch-action: none;
  user-select: none;
  -webkit-user-select: none;
}
.key {
  position: absolute;
  top: 0;
  box-sizing: border-box;
}
.key.white {
  height: 100%;
  background: var(--key);
  border-right: 1px solid var(--rule);
}
.key.white:last-child {
  border-right: 0;
}
.key.black {
  height: 60%;
  background: var(--ink);
  z-index: 1;
}
.key.on {
  background: var(--accent);
}
.key .label {
  position: absolute;
  bottom: 4px;
  left: 0;
  right: 0;
  text-align: center;
  font-size: 9px;
  color: var(--muted);
}


.debug {
  display: none;
  flex: 0 0 min(400px, 42vw);
  box-sizing: border-box;
  height: 100%;
  padding: calc(16px + env(safe-area-inset-top, 0px)) 16px calc(16px + env(safe-area-inset-bottom, 0px));
  background: var(--panel);
  border-left: 1.5px solid var(--rule);
  overflow-y: auto;
  grid-template-columns: minmax(0, 1fr);
  gap: 14px;
  align-content: start;
}
.debug.open {
  display: grid;
}
.debug section {
  min-width: 0;
}
@media (max-width: 759px) {
  .debug {
    position: fixed;
    top: 0;
    right: 0;
    bottom: 0;
    width: 100%;
    z-index: 10;
  }
}
@media (prefers-reduced-motion: reduce) {
  .chord {
    transition: none;
  }
}
.debug h2 {
  margin: 0 0 6px;
  font: 500 10px/1 var(--mono);
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--muted);
}
.debug .head {
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.debug .row {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  align-items: center;
}
.debug select,
.debug button {
  font: 400 11px/1.2 var(--mono);
  color: var(--ink);
  background: var(--paper);
  border: 1px solid var(--rule);
  border-radius: 0;
  padding: 4px 6px;
  min-width: 0;
}
.debug select {
  flex: 1 1 160px;
  width: 0;
  max-width: 100%;
}
.bars {
  display: grid;
  grid-template-columns: 8.5em minmax(0, 1fr) 3.2em;
  gap: 3px 8px;
  align-items: center;
  font-variant-numeric: tabular-nums;
}
.bar {
  height: 6px;
  background: color-mix(in srgb, var(--ink) 12%, transparent);
  position: relative;
}
.bar > i {
  position: absolute;
  inset: 0 auto 0 0;
  background: var(--ink);
}
.bars .v {
  text-align: right;
}
.kv {
  display: grid;
  grid-template-columns: 8.5em minmax(0, 1fr);
  gap: 3px 8px;
  font-variant-numeric: tabular-nums;
}
.kv > :nth-child(odd),
.bars > :nth-child(3n + 1) {
  color: var(--muted);
}
.log {
  margin: 0;
  padding: 0;
  list-style: none;
  display: grid;
  gap: 2px;
  font-variant-numeric: tabular-nums;
}
.log .t {
  color: var(--muted);
}

@media (max-width: 480px) {
  .key .label {
    display: none;
  }
}
.debug textarea {
  box-sizing: border-box;
  width: 100%;
  min-height: 7.5em;
  resize: vertical;
  font: 400 12px/1.5 var(--mono);
  color: var(--ink);
  background: var(--paper);
  border: 1px solid var(--rule);
  border-radius: 0;
  padding: 6px 8px;
}
.debug input[type="number"] {
  width: 4.5em;
  font: 400 11px/1.2 var(--mono);
  color: var(--ink);
  background: var(--paper);
  border: 1px solid var(--rule);
  border-radius: 0;
  padding: 4px 6px;
}
.debug .note {
  color: var(--muted);
  min-height: 1.4em;
}
.debug .now {
  font: 400 18px/1.2 var(--display);
}

</style>

<body>
<div class="app">
  <header class="masthead">
    <h1 class="name">Chord Face</h1>
    <div class="tools">
      <button class="chip" id="sound" type="button" aria-pressed="true">Sound</button>
    </div>
  </header>

  <main class="stage" id="stage">
    <figure class="portrait" id="portrait">
      <div class="faces" id="faces">
        <pre class="face paint" id="face" role="img" aria-label="演奏に反応する ASCII の顔"></pre>
        <pre class="face paint layer wave w1" aria-hidden="true"></pre>
        <pre class="face paint layer wave w2" aria-hidden="true"></pre>
        <pre class="face paint layer wave w3" aria-hidden="true"></pre>
          </div>
      <div class="res">
        <label title="顔の解像度（文字数）">
          <select id="res" aria-label="顔の解像度">
            <option value="60x40">60×40</option>
            <option value="90x60">90×60</option>
            <option value="120x80" selected>120×80</option>
            <option value="150x100">150×100</option>
          </select>
        </label>
      </div>
    </figure>
  </main>

  <section class="placard" aria-live="polite">
    <div class="chord" id="chord">—</div>
    <div class="hint" id="hint">鍵盤・PC キー（A〜K、Space でペダル）・MIDI で弾く</div>
  </section>

  <div class="keys" id="keys" role="group" aria-label="鍵盤"></div>
</div>
